<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access Management \u2013 New Age Portal</title>
<style>
  :root{
    --navy:#0F1B33;
    --navy-soft:#16233F;
    --accent:#2F6FED;
    --accent-dark:#1E4FC7;
    --bg:#F5F6F8;
    --border:#E5E7EB;
    --text:#111827;
    --muted:#6B7280;
    --muted-2:#9CA3AF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- layout ---------- */
  .header{
    position:sticky; top:0; z-index:30;
    background:#fff; border-bottom:1px solid var(--border);
  }
  .header-inner{
    width:92%; max-width:1800px; margin:0 auto;
    height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{
    width:34px; height:34px; border-radius:9px; background:var(--navy);
    color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .brand-text-title{font-size:14px; font-weight:700; color:var(--text); line-height:1.15;}
  .brand-text-sub{font-size:11px; color:var(--muted-2); line-height:1.15;}
  .header-right{ display:flex; align-items:center; gap:14px; }

  .view-toggle{ display:flex; align-items:center; border:1px solid var(--border); background:#fff; border-radius:9px; padding:3px; }
  .view-toggle button{
    border:none; background:transparent; padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:#6B7280;
  }
  .view-toggle button.active{ background:var(--navy); color:#fff; }

  .icon-btn{
    position:relative; width:38px; height:38px; border:none; background:transparent; border-radius:9px;
    display:flex; align-items:center; justify-content:center; color:#64748B;
  }
  .icon-btn:hover{ background:#F1F5F9; }
  .notif-dot{
    position:absolute; top:5px; right:5px; min-width:16px; height:16px; border-radius:8px; background:#EF4444; color:#fff;
    font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  .user-chip{ display:flex; align-items:center; gap:9px; padding-left:14px; border-left:1px solid var(--border); }
  .avatar{ border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex-shrink:0; }
  .user-chip .name{ font-size:12.5px; font-weight:700; color:#1F2937; line-height:1.2; }
  .user-chip .role{ font-size:10.5px; color:var(--muted-2); line-height:1.2; }

  .main{
    width:92%; max-width:1800px; margin:0 auto; padding:24px 0 56px;
    display:flex; flex-direction:column; gap:16px;
  }

  .welcome h1{ font-size:23px; font-weight:800; margin:0 0 4px; }
  .welcome p{ font-size:13.5px; color:var(--muted); margin:0; max-width:760px; }

  .grid-2{ display:grid; grid-template-columns: 2fr 1fr; gap:16px; align-items:start; }
  .grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; align-items:stretch; }
  .grid-3 > *{ height:100%; }
  @media (max-width: 1200px){ .grid-3{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 1080px){ .grid-2{ grid-template-columns: 1fr; } }
  @media (max-width: 640px){ .grid-3{ grid-template-columns: 1fr; } }

  .card{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius-container); padding:24px;
  }
  .card-compact{ padding:16px 24px; }
  .card-compact .list-row{ padding:12px 16px; }
  .card-tinted-amber{ border-color:#FDE7B8; background:#FFFCF5; }
  .card-tinted-orange{ border-color:#FBD9B8; background:#FFFAF5; }
  .card-tinted-violet{ border-color:#E4DBFB; background:#FBFAFF; }

  .section-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; gap:12px; }
  .section-head-left{ display:flex; align-items:center; gap:11px; }
  .section-icon{ width:34px; height:34px; border-radius:9px; background:#EAF1FF; color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .section-title{ font-size:16px; font-weight:800; margin:0; color:#111827; }
  .section-sub{ font-size:12px; color:var(--muted-2); margin:2px 0 0; }

  /* badges */
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap;}
  .badge-amber{ background:#FFFBEB; color:#B45309; border-color:#FDE68A; }
  .badge-blue{ background:#EFF6FF; color:#1D4ED8; border-color:#BFDBFE; }
  .badge-orange{ background:#FFF7ED; color:#C2410C; border-color:#FED7AA; }
  .badge-teal{ background:#F0FDFA; color:#0F766E; border-color:#99F6E4; }
  .badge-green{ background:#F0FDF4; color:#15803D; border-color:#BBF7D0; }
  .badge-red{ background:#FEF2F2; color:#B91C1C; border-color:#FECACA; }
  .badge-violet{ background:#F5F3FF; color:#6D28D9; border-color:#DDD6FE; }
  .badge-gray{ background:#F9FAFB; color:#6B7280; border-color:#E5E7EB; }
  .badge-indigo{ background:#EEF2FF; color:#4338CA; border-color:#C7D2FE; }

  /* consistent control sizing */
  :root{ --ctrl-h:40px; --radius-container:12px; --radius-control:9px; }

  /* search */
  .search-row{ display:flex; align-items:stretch; gap:10px; }
  .search-input-wrap{ position:relative; flex:1; min-width:0; }
  .search-input-wrap .search-ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#9CA3AF; pointer-events:none; display:flex; z-index:1; }
  .search-input{
    width:100%; height:var(--ctrl-h); padding:0 16px 0 42px; border-radius:var(--radius-control); border:1px solid var(--border);
    background:#F8FAFC; font-size:14px; outline:none; transition:.15s; box-sizing:border-box;
  }
  .search-input:focus{ background:#fff; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .browse-btn{
    height:var(--ctrl-h); padding:0 16px; border-radius:var(--radius-control); border:1px solid var(--border); background:#fff;
    color:#374151; font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    white-space:nowrap; transition:.15s; flex-shrink:0;
  }
  .browse-btn:hover{ background:#F9FAFB; border-color:#CBD5E1; }
  .browse-btn:active{ background:#F3F4F6; }

  .result-row, .list-row{
    border:1px solid var(--border); border-radius:11px; padding:16px; cursor:pointer; transition:.15s;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; background:#fff;
  }
  .result-row:hover, .list-row:hover{ border-color:#CBD5E1; box-shadow:0 2px 10px rgba(15,23,42,.05); }
  .result-title{ font-size:14px; font-weight:700; color:#111827; }
  .result-desc{ font-size:13px; color:var(--muted); margin-top:5px; line-height:1.5; }
  .result-meta{ display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font-size:12px; color:var(--muted); }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  .empty-state{ text-align:center; padding:36px 20px; }
  .empty-state .circle{ width:46px; height:46px; border-radius:999px; background:#F3F4F6; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:#9CA3AF; }
  .empty-state .title{ font-size:13.5px; font-weight:700; color:#374151; }
  .empty-state .sub{ font-size:12px; color:#9CA3AF; margin-top:4px; max-width:340px; margin-left:auto; margin-right:auto; }

  /* buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--ctrl-h); padding:0 18px; border-radius:var(--radius-control); font-size:13.5px; font-weight:700; border:none; transition:.15s; }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-primary:disabled{ background:#B9C4E0; cursor:not-allowed; }
  .btn-secondary{ background:#fff; color:#374151; border:1px solid #D1D5DB; }
  .btn-secondary:hover:not(:disabled){ background:#F9FAFB; border-color:#9CA3AF; }
  .btn-secondary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-danger{ background:#fff; color:#DC2626; border:1px solid #FECACA; }
  .btn-danger:hover:not(:disabled){ background:#FEF2F2; border-color:#FCA5A5; }
  .btn-danger:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; align-items:center; gap:10px; }

  /* drawer */
  .overlay{ position:fixed; inset:0; background:rgba(15,23,42,.32); z-index:50; display:none; }
  .overlay.show{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:clamp(420px, 38vw, 640px); max-width:100%;
    background:#fff; box-shadow:-12px 0 32px rgba(15,23,42,.14); z-index:51; overflow-y:auto;
    display:none;
  }
  .drawer.show{ display:block; }
  .drawer-head{
    position:sticky; top:0; background:#fff; z-index:2; display:flex; align-items:flex-start; justify-content:space-between;
    padding:22px 26px; border-bottom:1px solid var(--border);
  }
  .drawer-head h3{ font-size:18px; font-weight:800; margin:0; display:inline; }
  .drawer-head .sub{ font-size:12px; color:var(--muted-2); margin-top:5px; }
  .drawer-close{ border:none; background:transparent; color:#9CA3AF; padding:4px; }
  .drawer-close:hover{ color:#4B5563; }
  .drawer-body{ padding:24px 26px 40px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.show{ display:flex; }
  .modal-box{ background:#fff; border-radius:var(--radius-container); width:100%; max-width:440px; box-shadow:0 20px 50px rgba(0,0,0,.2); overflow:hidden; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:15px; font-weight:700; margin:0; }
  .modal-body{ padding:20px 22px; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  .field label.f-label{ display:block; font-size:11.5px; color:var(--muted-2); margin-bottom:4px; }
  .field .f-value{ font-size:13.5px; font-weight:600; color:#1F2937; }

  .kv-list{ border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .kv-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; font-size:13px; }
  .kv-row + .kv-row{ border-top:1px solid #F3F4F6; }
  .kv-row .k{ color:var(--muted-2); }
  .kv-row .v{ font-weight:600; color:#1F2937; text-align:right; }

  .divider{ border-top:1px solid var(--border); margin:22px 0; }

  textarea, .text-input, select.text-input{
    width:100%; padding:10px 13px; border-radius:var(--radius-control); border:1px solid var(--border); font-size:13.5px; outline:none; resize:none; font-family:inherit; box-sizing:border-box; transition:.15s;
  }
  input.text-input, select.text-input{ height:var(--ctrl-h); padding:0 13px; }
  textarea:focus, .text-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .input-error{ border-color:#DC2626 !important; }
  .input-error:focus{ box-shadow:0 0 0 3px rgba(220,38,38,.12) !important; }
  .field-error{ font-size:11.5px; color:#DC2626; margin-top:6px; display:flex; align-items:center; gap:5px; }
  .form-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted-2); margin-bottom:8px; display:block; }

  .choice-card{
    width:100%; text-align:left; padding:13px 15px; border-radius:10px; border:2px solid var(--border); background:#fff;
    display:flex; align-items:center; gap:12px; margin-bottom:8px;
  }
  .choice-card.selected{ border-color:var(--accent); background:#F5F8FF; }
  .choice-card .t{ font-size:13.5px; font-weight:700; color:#111827; }
  .choice-card .d{ font-size:11.5px; color:var(--muted-2); }

  .note-box{ display:flex; gap:8px; font-size:11.5px; color:#6B7280; background:#F9FAFB; border-radius:9px; padding:10px 12px; }
  .success-box{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#15803D; background:#F0FDF4; border:1px solid #BBF7D0; border-radius:9px; padding:12px 15px; }
  .warn-box{ display:flex; align-items:flex-start; gap:8px; font-size:13px; color:#374151; background:#F9FAFB; border:1px solid var(--border); border-radius:9px; padding:12px 15px; }
  .exception-box{ background:#FFFBEB; border:1px solid #FDE68A; border-radius:11px; padding:16px; margin-top:14px; }
  .exception-box .t1{ font-size:13.5px; font-weight:700; color:#92400E; }
  .exception-box .t2{ font-size:12px; color:#78350F; margin-top:3px; }

  .timeline{ padding-left:4px; }
  .t-row{ display:flex; gap:12px; position:relative; padding-bottom:22px; }
  .t-row:last-child{ padding-bottom:0; }
  .t-line{ position:absolute; left:9px; top:20px; bottom:0; width:1px; }
  .t-dot{ width:20px; height:20px; flex-shrink:0; margin-top:1px; z-index:1; }
  .t-label{ font-size:13.5px; font-weight:700; color:#111827; }
  .t-label.muted{ color:#9CA3AF; }
  .t-meta{ font-size:11.5px; color:#6B7280; margin-top:2px; }

  .divider-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted-2); margin-bottom:12px; }

  .activity-row{ padding:11px 0; }
  .activity-row + .activity-row{ border-top:1px solid #F3F4F6; }
  .activity-action{ font-size:13px; font-weight:700; color:#1F2937; }
  .activity-resource{ font-size:12px; color:#6B7280; margin-top:2px; }
  .activity-meta{ font-size:11.5px; color:#9CA3AF; margin-top:3px; }

  .board-card{ border:1px solid var(--border); border-radius:var(--radius-container); padding:16px; cursor:pointer; background:#fff; transition:.15s; display:flex; flex-direction:column; }
  .board-card:hover{ border-color:#CBD5E1; box-shadow:0 2px 10px rgba(15,23,42,.05); }
  .board-card .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .board-card .t{ font-size:13.5px; font-weight:700; color:#111827; line-height:1.35; }
  .board-card .row1 .badge{ flex-shrink:0; margin-top:1px; }
  .board-card-body{ flex:1; }
  .manage-link{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--accent); font-weight:700; margin-top:14px; padding-top:12px; border-top:1px solid #F3F4F6; }

  .toggle-switch{ position:relative; width:42px; height:24px; border-radius:999px; border:none; flex-shrink:0; transition:.15s; }
  .toggle-switch:hover{ filter:brightness(0.94); }
  .toggle-knob{ position:absolute; top:2px; width:20px; height:20px; border-radius:999px; background:#fff; transition:.15s; }

  .notif-panel{ position:absolute; right:0; top:46px; width:340px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 34px rgba(15,23,42,.15); z-index:40; display:none; overflow:hidden; }
  .notif-panel.show{ display:block; }
  .notif-panel-head{ padding:13px 16px; font-size:13.5px; font-weight:700; border-bottom:1px solid var(--border); }
  .notif-list{ max-height:320px; overflow-y:auto; }
  .notif-item{ padding:12px 16px; border-bottom:1px solid #F9FAFB; display:flex; gap:9px; align-items:flex-start; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-unread-dot{ width:6px; height:6px; border-radius:999px; background:var(--accent); margin-top:5px; flex-shrink:0; }
  .notif-unread-dot.read{ background:transparent; }
  .notif-text{ font-size:12.5px; color:#1F2937; }
  .notif-sub{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .notif-ts{ font-size:10.5px; color:#9CA3AF; }
  .notif-channel{ font-size:9.5px; font-weight:700; color:#9CA3AF; display:flex; align-items:center; gap:3px; }

  .hidden{ display:none !important; }
  svg{ display:block; }

  /* toast */
  .toast-container{ position:fixed; bottom:24px; right:24px; z-index:90; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .toast{
    display:flex; align-items:center; gap:10px; background:#111827; color:#fff; padding:12px 16px; border-radius:var(--radius-control);
    font-size:13px; font-weight:600; box-shadow:0 12px 28px rgba(15,23,42,.25); animation: toastIn .22s ease; max-width:360px;
  }
  .toast.leaving{ animation: toastOut .18s ease forwards; }
  .toast .toast-icon{ display:flex; flex-shrink:0; }
  .toast.success{ background:#065F46; }
  .toast.success .toast-icon{ color:#6EE7B7; }
  .toast.error{ background:#991B1B; }
  .toast.error .toast-icon{ color:#FCA5A5; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastOut{ from{ opacity:1; transform:translateY(0); } to{ opacity:0; transform:translateY(6px); } }

  /* drawer / modal transitions */
  .drawer.show{ animation: drawerIn .2s ease; }
  .drawer.closing{ display:block; animation: drawerOut .16s ease forwards; }
  .overlay.closing{ display:block; animation: overlayOut .16s ease forwards; }
  @keyframes drawerIn{ from{ transform:translateX(26px); opacity:.5; } to{ transform:translateX(0); opacity:1; } }
  @keyframes drawerOut{ from{ transform:translateX(0); opacity:1; } to{ transform:translateX(26px); opacity:0; } }
  @keyframes overlayOut{ from{ opacity:1; } to{ opacity:0; } }
  .modal-box{ animation: modalIn .18s ease; }
  .modal-overlay.closing{ animation: overlayOut .15s ease forwards; }
  .modal-overlay.closing .modal-box{ animation: modalOut .15s ease forwards; }
  @keyframes modalIn{ from{ opacity:0; transform:scale(.96) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  @keyframes modalOut{ from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(.97); } }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-root" class="toast-container"></div>

<script>
/* ============================================================================
   ICONS (minimal inline SVG set, stroke-based, mimics lucide style)
   ============================================================================ */
const ICONS = {
  search: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
  bell: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
  chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
  check: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>`,
  circle: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`,
  x: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,

function showToast(message, type){
  const root = document.getElementById("toast-root");
  if (!root) return;
  const id = "toast-" + Date.now() + "-" + Math.floor(Math.random()*1000);
  const el = document.createElement("div");
  el.className = "toast " + (type || "success");
  el.id = id;
  const icon = (type === "error") ? ICONS.xCircle : ICONS.checkCircle;
  el.innerHTML = '<span class="toast-icon">'+icon+'</span><span>'+esc(message)+'</span>';
  root.appendChild(el);
  setTimeout(function(){
    el.classList.add("leaving");
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, 2800);
}

function approveRequest(requestId){
  const r = findRequest(requestId);
  if (!r) return;
  const now = "17 Aug 2026, 2:22 PM";
  const approvedStep = { label:"Approved", actor:r.approver, ts:now, state:"done" };
  if (r.automation){
    const finalStatus = r.onBehalf ? "Access Provisioned" : "Completed";
    r.status = finalStatus; r.updated = "17 Aug 2026";
    r.timeline = [ r.timeline[0], approvedStep,
      { label:"Access Automatically Provisioned", actor:"Automated Provisioning", ts:now, state:"done" },
      r.onBehalf ? { label:"Access Provisioned \u2014 awaiting closure", actor:"", ts:"", state:"current" } : { label:"Completed", actor:"System", ts:now, state:"done" } ];
  } else {
    r.status = "Pending Manual Provisioning"; r.updated = "17 Aug 2026";
    r.timeline = [ r.timeline[0], approvedStep,
      { label:"Pending Manual Provisioning", actor:r.provider, ts:"\u2014", state:"current" },
      { label: r.onBehalf ? "Access Provisioned" : "Completed", actor:"", ts:"", state:"pending" } ];
  }
  pushAudit("Request approved", r.approver, requestId + " \u2014 " + r.accessLabel);
  pushNotification("employee", "Your request " + requestId + " was approved by " + r.approver + ".", "portal");
  if (r.automation) pushNotification("employee", "Access provisioned for " + requestId + " \u2014 " + r.accessLabel + ".", "portal");
  else pushNotification("admin", requestId + " (" + r.accessLabel + ") is ready for manual provisioning.", "portal");
}

function rejectRequest(requestId, reason){

  pushAudit("Request rejected", r.approver, requestId + " \u2014 Reason: " + (reason || "Not specified"));
  pushNotification("employee", "Your request " + requestId + " was rejected by " + r.approver + ".", "portal");
}

function provisionManually(requestId){
  const r = findRequest(requestId);
  if (!r) return;
  const now = "17 Aug 2026, 3:05 PM";
  const finalStatus = r.onBehalf ? "Access Provisioned" : "Completed";
  r.status = finalStatus; r.updated = "17 Aug 2026";
  r.timeline = r.timeline.map(function(s,i){
    if (i === 2) return { label:"Access Provisioned", actor:r.provider, ts:now, state:"done" };
    if (i === 3) return r.onBehalf ? { label:"Access Provisioned \u2014 awaiting closure", actor:"", ts:"", state:"current" } : { label:"Completed", actor:"System", ts:now, state:"done" };
    return s;
  });
  pushAudit("Access provisioned (manual)", currentUser().name, requestId + " \u2014 " + r.accessLabel);
  pushNotification("employee", "Access has been provisioned for " + requestId + ".", "portal");
}

function closeRequestAction(requestId){
  const r = findRequest(requestId);
  if (!r) return;
  r.status = "Completed"; r.updated = "17 Aug 2026";

function updateAccessConfig(accessId, changes){
  const access = findAccess(accessId);
  const diffs = [];
  if (access.approver !== changes.approver) diffs.push("Approver: " + access.approver + " \u2192 " + changes.approver);
  if (access.backupApprover !== changes.backupApprover) diffs.push("Backup approver: " + access.backupApprover + " \u2192 " + changes.backupApprover);
  if (access.provider !== changes.provider) diffs.push("Access provider: " + access.provider + " \u2192 " + changes.provider);
  Object.assign(access, changes);
  pushAudit("Access configuration updated", currentUser().name, access.tool + " \u2013 " + access.name + (diffs.length ? " \u2014 " + diffs.join(", ") : ""));
}

function openDrawer(type, params){ state.drawer = { type: type, params: params||{} }; state.modal = null; render(); }
function closeDrawer(onDone){
  if (!state.drawer) { if (onDone) onDone(); return; }
  const el = document.querySelector(".drawer");
  const ov = document.querySelector(".overlay");
  if (el) { el.classList.remove("show"); el.classList.add("closing"); }
  if (ov) { ov.classList.remove("show"); ov.classList.add("closing"); }
  setTimeout(function(){ state.drawer = null; render(); if (onDone) onDone(); }, 160);
}
function openModal(type, params){ state.modal = { type: type, params: params||{} }; render(); }
function closeModal(){
  if (!state.modal) return;
  const el = document.querySelector(".modal-overlay");
  if (el) el.classList.add("closing");
  setTimeout(function(){ state.modal = null; render(); }, 150);
}
/* Closes an open modal (if any) first, then the drawer beneath it \u2014 avoids both
   independently re-rendering the app mid-animation and racing each other. */
function closeAll(){
  if (state.modal){

/* ============================================================================
   SMALL HTML HELPERS
   ============================================================================ */
function esc(str){ return (str==null?"":String(str)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ============================================================================
   INLINE FORM VALIDATION HELPERS
   ============================================================================ */
function setFieldError(fieldId, msg){
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.classList.add("input-error");
  let err = document.getElementById(fieldId+"-error");
  if (!err){
    err = document.createElement("div");
    err.id = fieldId+"-error";
    err.className = "field-error";
    el.insertAdjacentElement("afterend", err);
  }
  err.innerHTML = '<span style="display:flex;">'+ICONS.alertTriangle+'</span>'+esc(msg);
}
function clearFieldError(fieldId){
  const el = document.getElementById(fieldId);
  if (el) el.classList.remove("input-error");
  const err = document.getElementById(fieldId+"-error");
  if (err) err.remove();
}

function initials(name){ return name.split(" ").map(function(p){return p[0];}).slice(0,2).join(""); }
function avatarHtml(name, size, tone){
  size = size || 34;
  tone = tone || "#475569";
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+tone+';font-size:'+Math.round(size*0.36)+'px;">'+esc(initials(name))+'</div>';
}
function badgeHtml(text, cls){ return '<span class="badge '+cls+'">'+text+'</span>'; }
function statusBadge(status){ return badgeHtml(esc(status), STATUS_CLASS[status] || "badge-gray"); }

function timelineHtml(steps){
  return '<div class="timeline">' + steps.map(function(s,i){
    const isLast = i === steps.length-1;
    let dot;
    if (s.state === "done") dot = '<div class="t-dot" style="color:#22C55E;">'+ICONS.checkCircle+'</div>';
    else if (s.state === "current") dot = '<div class="t-dot" style="display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:999px;"><div style="width:8px;height:8px;border-radius:999px;background:var(--accent);"></div></div>';
    else dot = '<div class="t-dot" style="color:#D1D5DB;">'+ICONS.circle+'</div>';
    return '<div class="t-row">'
      + (!isLast ? '<div class="t-line" style="background:'+(s.state==='done' ? '#22C55E' : '#E5E7EB')+';"></div>' : "")
      + dot
      + '<div>'
      + '<div class="t-label '+(s.state==='pending' ? 'muted':'')+'">'+esc(s.label)+'</div>'
      + ((s.actor || s.ts) ? '<div class="t-meta">'+esc(s.actor)+' '+(s.actor && s.ts ? "\u00b7" : "")+' '+esc(s.ts)+'</div>' : "")
      + '</div></div>';
  }).join("") + '</div>';
}

function emptyStateHtml(iconKey, title, sub){
  return '<div class="empty-state">'
    + '<div class="circle">'+ICONS[iconKey]+'</div>'
    + '<div class="title">'+esc(title)+'</div>'
    + (sub ? '<div class="sub">'+esc(sub)+'</div>' : "")
    + '</div>';
}

function fieldHtml(label, value){
  return '<div class="field"><label class="f-label">'+esc(label)+'</label><div class="f-value">'+value+'</div></div>';
}

function handleSubmitRequest(accessId){

        <div class="btn-row" style="margin-top:20px;">\
          <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>\
          <button class="btn btn-danger" style="flex:1;" onclick="handleReject(\''+params.requestId+'\')">Confirm Rejection</button>\
        </div>\
      </div>\
    </div></div>';
  }
  if (type === "exception-confirm"){
    return '<div class="modal-overlay show"><div class="modal-box">\
      <div class="modal-head"><h3>Exception request submitted</h3><button class="drawer-close" onclick="closeModal()">'+ICONS.x+'</button></div>\
      <div class="modal-body">\
        <div class="success-box">'+ICONS.checkCircle+' Your request has been sent for review.</div>\
        <div class="kv-list" style="margin-top:16px;">\
          <div class="kv-row"><span class="k">Request ID</span><span class="v mono">'+esc(params.id)+'</span></div>\
          <div class="kv-row"><span class="k">Status</span><span class="v">'+statusBadge("Pending Exception Approval")+'</span></div>\
          <div class="kv-row"><span class="k">Access</span><span class="v">'+esc(params.accessLabel)+'</span></div>\
          <div class="kv-row"><span class="k">Reviewer</span><span class="v">'+esc(params.approver)+'</span></div>\
        </div>\
        <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="closeModal()">Done</button>\
      </div>\
    </div></div>';
  }
  return "";
}
function handleCloseRequest(requestId){
  closeRequestAction(requestId);
  closeAll();
  showToast("Request "+requestId+" closed", "success");
}
function handleReject(requestId){
  clearFieldError("reject-reason");
  const reasonEl = document.getElementById("reject-reason");
  const reason = reasonEl ? reasonEl.value : "";
  if (!reason.trim()){ setFieldError("reject-reason", "Please provide a rejection reason."); return; }
  rejectRequest(requestId, reason);
  closeAll();
  showToast("Request "+requestId+" rejected", "error");
}

/* ============================================================================
   ROOT RENDER
   ============================================================================ */
function render(){
  document.getElementById("app").innerHTML =
    renderHeader()
    + '<div class="main">'+renderMain()+'</div>'
    + '<div class="overlay '+(state.drawer ? 'show':'')+'" onclick="closeDrawer()"></div>'
    + '<div class="drawer '+(state.drawer ? 'show':'')+'">'+renderDrawer()+'</div>'
    + renderModal();
}
/* re-render only the main content area (keeps header/notif state), used while typing in search */
function renderMainOnly(){
  const mainEl = document.querySelector(".main");
  if (mainEl) mainEl.innerHTML = renderMain();
}

render();
</script>
</body>
</html>
